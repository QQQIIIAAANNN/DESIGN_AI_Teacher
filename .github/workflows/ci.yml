name: CI

on:
  push:
    branches: [main, feat/local-law-kb]
  pull_request:
    branches: [main, fix/visual-revision-hardening]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build local law database
        run: |
          npm run laws:build
          wc -c knowledge/laws/laws.sqlite

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
